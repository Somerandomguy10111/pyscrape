[project]
name = "pyscrape"
version = "0.1.0"
authors = [{name = "Daniel Hollarek", email = "daniel.hollarek@googlemail.com"}]
description = "A very good project indeed"
readme = "readme.md"
dependencies = ['selenium','beautifulsoup4','func_timeout', 'requests',
    'setuptools', 'undetected_chromedriver','markdownify']

[tool.setuptools.packages.find]
include = ["pyscrape*"]

[tool.deptry.per_rule_ignores]
DEP002 = ["setuptools"]

[project.optional-dependencies]
test = ["holytools"]